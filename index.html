4a6-4dd5-9577-446ab6219113_en","loc":null,"rat":"Gaia-X policy rules and architecture is one of the European initiatives the framework draws on.","x":0.3559,"y":0.4247},{"id":"concept_sovereignty_objectives","label":"Eight Sovereignty Objectives (SOV-1..SOV-8)","type":"concept","ft":"concept","com":35,"deg":9,"src":"Commissione UE — Cloud Sovereignty Framework v1.2.1","srcRaw":"raw/commission_europa_eu_document_download_09579818-64a6-4dd5-9577-446ab6219113_en.md","url":"https://commission.europa.eu/document/download/09579818-64a6-4dd5-9577-446ab6219113_en","loc":null,"rat":"Framework measures sovereignty across eight objectives: Strategic (SOV-1), Legal & Jurisdictional (SOV-2), Data & AI (SOV-3), Operational (SOV-4), Supply Chain (SOV-5), Technology (SOV-6), Security & Compliance (SOV-7), Environmental Sustainability (SOV-8).","x":0.3504,"y":0.3428},{"id":"policy_seal_assurance_levels","label":"Sovereignty Effective Assurance Levels (SEAL-0..SEAL-4)","type":"policy","ft":"document","com":12,"deg":3,"src":"Commissione UE — Cloud Sovereignty Framework v1.2.1","srcRaw":"raw/commission_europa_eu_document_download_09579818-64a6-4dd5-9577-446ab6219113_en.md","url":"https://commission.europa.eu/document/download/09579818-64a6-4dd5-9577-446ab6219113_en","loc":null,"rat":"SEAL is used as a Minimum Assurance Level per objective; tenders below the required level across all objectives are rejected.","x":0.345,"y":0.3245},{"id":"concept_sovereignty_score","label":"Sovereignty Score","type":"concept","ft":"concept","com":46,"deg":2,"src":"Commissione UE — Cloud Sovereignty Framework v1.2.1","srcRaw":"raw/commission_europa_eu_document_download_09579818-64a6-4dd5-9577-446ab6219113_en.md","url":"https://commission.europa.eu/document/download/09579818-64a6-4dd5-9577-446ab6219113_en","loc":null,"rat":"Weighted score across the eight objectives, complementary to SEAL, contributing to the quality score of the tender as an award criterion.","x":0.2882,"y":0.3037},{"id":"claim_seal_scale_semantics","label":"SEAL scale semantics (SEAL-0 to SEAL-4)","type":"claim","ft":"rationale","com":12,"deg":1,"src":"Commissione UE — Cloud Sovereignty Framework v1.2.1","srcRaw":"raw/commission_europa_eu_document_download_09579818-64a6-4dd5-9577-446ab6219113_en.md","url":"https://commission.europa.eu/document/download/09579818-64a6-4dd5-9577-446ab6219113_en","loc":null,"rat":"SEAL-0 No Sovereignty (exclusive non-EU control); SEAL-1 Jurisdictional Sovereignty (EU law applies but limited enforceability); SEAL-2 Data Sovereignty (EU law enforceable, material non-EU dependencies remain); SEAL-3 Digital Resilience (EU actors exercise meaningful but not full influence); SEAL-4 Full Digital Sovereignty (complete EU control, no critical non-EU dependencies).","x":0.2967,"y":0.2493},{"id":"claim_sovereignty_score_weighting","label":"Sovereignty Score weighting (Supply Chain highest at 20%)","type":"claim","ft":"rationale","com":46,"deg":2,"src":"Commissione UE — Cloud Sovereignty Framework v1.2.1","srcRaw":"raw/commission_europa_eu_document_download_09579818-64a6-4dd5-9577-446ab6219113_en.md","url":"https://commission.europa.eu/document/download/09579818-64a6-4dd5-9577-446ab6219113_en","loc":null,"rat":"Weights: SOV-5 Supply Chain 20% (highest); SOV-1 Strategic, SOV-4 Operational, SOV-6 Technology 15% each; SOV-2 Legal, SOV-3 Data & AI, SOV-7 Security & Compliance 10% each; SOV-8 Environmental 5%. Legal (SOV-2) and Security (SOV-7) are weighted lower because the procurement already contains significant safeguards in those domains.","x":0.2716,"y":0.2414},{"id":"claim_framework_concrete_metrics","label":"Framework moves from abstract sovereignty principles to concrete metrics","type":"claim","ft":"rationale","com":2,"deg":2,"src":"Commissione UE — Cloud Sovereignty Framework v1.2.1","srcRaw":"raw/commission_europa_eu_document_download_09579818-64a6-4dd5-9577-446ab6219113_en.md","url":"https://commission.europa.eu/document/download/09579818-64a6-4dd5-9577-446ab6219113_en","l
